name: Main
on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/oven-sh/setup-bun@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  changesets:
    name: Changesets
    needs: verify
    # The version PR and the branch/tag pushes all use a short-lived GitHub
    # App token minted via the github-sts action (authorized by
    # .github/sts/changesets.sts.yaml): the built-in GITHUB_TOKEN is not
    # allowed to create pull requests, and a push made with it would not
    # trigger the PR's verification workflows, so checkout persists the App
    # token for the action's git pushes.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
        with:
          policy: changesets
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # zizmor: ignore[artipacked] Changesets needs the App token for authenticated version commits and release tags.
        with:
          fetch-depth: 0
          token: ${{ steps.sts.outputs.token }}
      - uses: tempoxyz/gh-actions/vendor/oven-sh/setup-bun@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
      - run: bun install --frozen-lockfile
      - uses: tempoxyz/gh-actions/vendor/changesets/action@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: bun run changeset:version
          publish: bun run changeset:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.sts.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
