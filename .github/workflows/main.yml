name: Main
on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: tempoxyz/gh-actions/vendor/oven-sh/setup-bun@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  changesets:
    name: Changesets
    needs: verify
    # The version PR and the branch/tag pushes all use a short-lived GitHub
    # App token minted via the github-sts action (authorized by
    # .github/sts/changesets.sts.yaml): the built-in GITHUB_TOKEN is not
    # allowed to create pull requests, and a push made with it would not
    # trigger the PR's verification workflows, so checkout persists the App
    # token for the action's git pushes.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@c0292122e255def866c64c55e5844d1e7d5fe7ad # main
        with:
          policy: changesets
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ steps.sts.outputs.token }}
      - uses: tempoxyz/gh-actions/vendor/oven-sh/setup-bun@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - run: bun install --frozen-lockfile
      - uses: tempoxyz/gh-actions/vendor/changesets/action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: bun run changeset:version
          publish: bun run changeset:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.sts.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

